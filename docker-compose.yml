services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]

  backend:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    # This instance has no public IP and sits behind an ALB, which routes
    # marketing.91astrology.com/api/* here directly (its own target group
    # on port 8082). Change the host port below if 8082 is ever taken.
    ports:
      - "8082:8082"
    depends_on:
      - mongo
      - redis
    networks: [internal]

  frontend:
    build:
      context: ../Marketing-Agent-Dashboard
      args:
        NEXT_PUBLIC_API_URL: https://marketing.91astrology.com/api/v1
    restart: unless-stopped
    # ALB routes marketing.91astrology.com/* (everything else) here
    # directly (its own target group on port 3002).
    ports:
      - "3002:3000"
    depends_on:
      - backend
    networks: [internal]

volumes:
  mongo_data:
  redis_data:

networks:
  internal:
